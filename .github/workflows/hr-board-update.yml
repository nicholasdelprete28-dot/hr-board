name: Update HR Board Data

# Runs at 10:00 AM EST, 1:00 PM EST, and 5:00 PM EST each day.
# Also runnable manually anytime from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

# Explicitly grant this workflow permission to push commits. Without this,
# many repos default the automated token to read-only, which lets the bot
# commit locally but blocks the actual push with a 403 error.
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run the data-fetching script
        run: python fetch_hr_data.py

      - name: Commit and push players.json and today's snapshot if changed
        run: |
          git config user.name "hr-board-bot"
          git config user.email "actions@github.com"
          git add players.json history/
          git diff --quiet --cached || git commit -m "Update player data ($(date -u +%Y-%m-%dT%H:%M))"
          # Pull in anything pushed to the repo (e.g. a manual edit on GitHub's
          # website) since this job's checkout, then push. Avoids "rejected -
          # fetch first" errors when you and the bot edit around the same time.
          git pull --rebase origin main
          git push
