<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Going Yard — Subscribe</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d0b; --surface2:#141a17; --line:#232b26; --text:#f2f0e6;
    --muted:#8b948d; --gold:#e3a548; --green:#4fdb9a;
    --mono:'JetBrains Mono',monospace; --display:'Space Grotesk',sans-serif; --body:'Manrope',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--body); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{max-width:420px; width:100%; text-align:center;}
  h1{font-family:var(--display); font-weight:700; font-size:32px; margin:0 0 8px; background:linear-gradient(100deg,#fff 30%,var(--gold) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  p{color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 24px;}
  .btn{display:inline-block; width:100%; background:var(--green); color:#0a0d0b; border:none; border-radius:10px; padding:14px; font-family:var(--display); font-weight:700; font-size:15px; text-decoration:none; cursor:pointer; box-sizing:border-box;}
  .btn.secondary{background:transparent; border:1px solid var(--line); color:var(--text); margin-top:10px;}
  .fine{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:20px;}
</style>
</head>
<body>
<div class="card">
  <h1>Going Yard</h1>
  <p>Subscribe to unlock all four prediction boards — HR, HRR, Total Bases, and Pitcher Ks — with live sportsbook odds and per-player line switching.</p>
  <a class="btn" href="/api/auth/login">Log in with Whop</a>
  <a class="btn secondary" href="https://whop.com/going-yard/">Subscribe on Whop</a>
  <div class="fine">Already subscribed? Log in above to unlock instantly.</div>
</div>
</body>
</html>
